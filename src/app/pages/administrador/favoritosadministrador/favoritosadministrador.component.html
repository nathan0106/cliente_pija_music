<div class="admin-container">
  <h2>Gestión de Artistas Favoritos</h2>

  <div class="form-section">
    <label>Nombre del artista</label>
    <input [(ngModel)]="artistaNuevo.nombre" type="text" placeholder="Ej. Jorge Guerrero" />
    
    <label>URL de la foto</label>
    <input [(ngModel)]="artistaNuevo.foto" type="text" placeholder="assets/artistas/imagen.jpg" />

    <h3>Canciones</h3>
    <div *ngFor="let cancion of artistaNuevo.canciones; let i = index" class="cancion-form">
      <label>Título</label>
      <input [(ngModel)]="cancion.titulo" placeholder="Título de la canción" />

      <label>Duración</label>
      <input [(ngModel)]="cancion.duracion" placeholder="Ej. 3:45" />

      <label>Link del video</label>
      <input [(ngModel)]="cancion.link" placeholder="https://..." />

      <button (click)="eliminarCancion(i)">Eliminar</button>
    </div>

    <button (click)="agregarCancion()">+ Agregar canción</button>

    <button class="guardar-btn" (click)="guardarArtista()">Guardar Artista</button>
  </div>

  <hr />

  <h3>Artistas Agregados</h3>
  <ul>
    <li *ngFor="let artista of artistas">
      {{ artista.nombre }} - {{ artista.canciones.length }} canciones
    </li>
  </ul>
</div>
