<div class="admin-container">
  <h2>Gestión de Playlists</h2>

  <div class="form-section">
    <label>Nombre de la Playlist</label>
    <input [(ngModel)]="playlistNueva.nombre" type="text" placeholder="Ej. Música para el Llano" />

    <label>Descripción</label>
    <input [(ngModel)]="playlistNueva.descripcion" type="text" placeholder="Breve descripción..." />

    <label>Seleccione un Cantante</label>
    <select [(ngModel)]="playlistNueva.cantante">
      <option value="">-- Selecciona un cantante --</option>
      <option *ngFor="let cantante of cantantes" [value]="cantante">{{ cantante }}</option>
    </select>

    <h3>Canciones</h3>
    <div *ngFor="let cancion of playlistNueva.canciones; let i = index" class="cancion-form">
      <label>Título</label>
      <input [(ngModel)]="cancion.titulo" placeholder="Título de la canción" />

      <label>Duración</label>
      <input [(ngModel)]="cancion.duracion" placeholder="Ej. 3:45" />

      <label>Link del video</label>
      <input [(ngModel)]="cancion.link" placeholder="https://..." />

      <button (click)="eliminarCancion(i)">Eliminar</button>
    </div>

    <button (click)="agregarCancion()">+ Agregar canción</button>
    <button class="guardar-btn" (click)="guardarPlaylist()">Guardar Playlist</button>
  </div>

  <hr />

  <h3>Playlists Guardadas</h3>
  <ul>
    <li *ngFor="let playlist of playlists">
      <strong>{{ playlist.nombre }}</strong> ({{ playlist.cantante }}) - {{ playlist.canciones.length }} canciones
    </li>
  </ul>
</div>
