<div class="notificaciones-admin">
  <h2>Notificaciones de Administrador</h2>

  <!-- Filtros para las notificaciones -->
  <div class="filtros">
    <button (click)="filtrarNotificaciones('todos')" [ngClass]="{'activo': tipoSeleccionado === 'todos'}">Todos</button>
    <button (click)="filtrarNotificaciones('usuario')" [ngClass]="{'activo': tipoSeleccionado === 'usuario'}">Usuarios</button>
    <button (click)="filtrarNotificaciones('contenido')" [ngClass]="{'activo': tipoSeleccionado === 'contenido'}">Contenido</button>
    <button (click)="filtrarNotificaciones('evento')" [ngClass]="{'activo': tipoSeleccionado === 'evento'}">Eventos</button>
    <button (click)="filtrarNotificaciones('sistema')" [ngClass]="{'activo': tipoSeleccionado === 'sistema'}">Sistema</button>
    <button (click)="filtrarNotificaciones('seguridad')" [ngClass]="{'activo': tipoSeleccionado === 'seguridad'}">Seguridad</button>
  </div>

  <!-- Lista de Notificaciones -->
  <ul>
    <li *ngFor="let notificacion of notificacionesFiltradas">
      <div class="mensaje" [ngClass]="notificacion.tipo">
        <p>{{ notificacion.mensaje }}</p>
        <small>{{ notificacion.fecha | date: 'short' }}</small>
        <button (click)="eliminarNotificacion(notificacion.id)">Eliminar</button>
      </div>
    </li>
  </ul>
</div>
