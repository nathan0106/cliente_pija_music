<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <!-- Logo -->
    <div class="logo-section">
      <img src="/logo.png" alt="Logo Turismo" />
    </div>

    <!-- Sección Descubre -->
    <div class="section">
      <h2>Descubre</h2>
      <div class="nav-card">
        <button class="nav-button" (click)="navigateTo('home')">
          <mat-icon>home</mat-icon>
          <span>Inicio</span>
        </button>
      </div>
      <div class="nav-card">
        <button class="nav-button" (click)="navigateTo('buscar')">
          <mat-icon>search</mat-icon>
          <span>Buscar</span>
        </button>
      </div>
    </div>

    <!-- Sección Biblioteca -->
    <div class="section">
      <p class="section-titulo">Biblioteca</p>
      <div class="nav-card">
        <button class="nav-button" (click)="navigateTo('playlists')">
          <mat-icon>subscriptions</mat-icon>
          <span>Playlists</span>
        </button>
      </div>
      <div class="nav-card">
        <button class="nav-button" (click)="customize()">
          <mat-icon>sentiment_satisfied</mat-icon>
          <span>Personalizar</span>
        </button>
      </div>
      <div class="nav-card">
        <button class="nav-button" (click)="navigateTo('favoritos')">
          <mat-icon>bookmark</mat-icon>
          <span>Favoritos</span>
        </button>
      </div>
      <div class="nav-card">
        <button class="nav-button" (click)="navigateTo('notificaciones')">
          <mat-icon>notifications</mat-icon>
          <span>Notificaciones</span>
        </button>
      </div>
    </div>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content class="content">
    <mat-toolbar color="primary" class="topbar">
      <span class="tabs">
        <button mat-button (click)="changeCategory('musica')">Música</button>
        <button mat-button (click)="changeCategory('cultura')">Cultura</button>
        <button mat-button (click)="changeCategory('turismo')">Turismo</button>
      </span>

      <span class="spacer"></span>

      <!-- Campo de búsqueda -->
      <mat-form-field appearance="outline">
        <mat-label>Buscar</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchQuery" (input)="onSearch()" placeholder="Buscar contenido..." />
      </mat-form-field>

      <!-- Login y registro -->
      <button mat-button [routerLink]="'/login'">Inicio de sesión</button>
      <button mat-raised-button color="accent" [routerLink]="'/register'">
        Registro <mat-icon>person_add</mat-icon>
      </button>
    </mat-toolbar>

    <!-- Título -->
    <h2 class="titulo-buscar">Buscar</h2>

    <!-- Grid de resultados -->
    <div class="card-grid">
      <div *ngFor="let card of filteredCards" class="card">
        <div class="card-image" [style.backgroundImage]="'url(' + card.imageUrl + ')'"></div>
        <div class="artist-name">{{ card.title }}</div>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
