<h2 mat-dialog-title>Video de la Canción</h2>
<mat-dialog-content>
  <iframe [src]="videoUrl" width="100%" height="315" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-buttun (click)="closeModal()">Cerrar</button>
</mat-dialog-actions>
