<div class="container">
  <div class="logo">
    <img src="/logo.png" alt="Pija Music Logo" />
    <h1>PIJA MUSIC</h1>
  </div>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" />
      <mat-error *ngIf="passwordForm.get('password')?.hasError('required')">
        La contraseña es obligatoria
      </mat-error>
      <mat-error *ngIf="passwordForm.get('password')?.hasError('minlength')">
        Mínimo 6 caracteres
      </mat-error>
    </mat-form-field>
  
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Confirmar contraseña</mat-label>
      <input matInput type="password" formControlName="confirmPassword" />
      <mat-error *ngIf="passwordForm.get('confirmPassword')?.hasError('required')">
        Confirmación obligatoria
      </mat-error>
      <mat-error *ngIf="passwordForm.hasError('passwordsMismatch')">
        Las contraseñas no coinciden
      </mat-error>
    </mat-form-field>
  
    <button mat-raised-button color="primary" type="submit" [disabled]="passwordForm.invalid">
      Guardar
    </button>
  </form>
  
</div>
