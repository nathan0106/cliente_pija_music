<div class="detalle-container" *ngIf="lugar">
  <h1>{{ lugar.nombre }}</h1>
  
  <p><strong>Dirección:</strong> {{ lugar.direccion }}</p>
  <p><strong>Horario:</strong> {{ lugar.horario }}</p>

  <p><strong>Descripción:</strong></p>
  <p>{{ lugar.descripcion }}</p>

  <div class="imagenes" *ngIf="lugar.imagenes && lugar.imagenes.length > 0">
    <h3>Galería de imágenes:</h3>
    <div class="galeria">
      <img *ngFor="let img of lugar.imagenes" [src]="img" alt="Imagen de {{ lugar.nombre }}">
    </div>
  </div>

  <button routerLink="/dashboard">Volver al Dashboard</button>
</div>

<div *ngIf="!lugar">
  <p>Cargando información del lugar...</p>
</div>
